# samples: niri-wm/niri/37725735250-113143344875
# Rust 运行时 panic 头 (thread '<name>' (id)? panicked at <loc>:)。消息行无统一结构,
# 不用扩展吞行 — 单行块 + context.after=2 带出 panic 消息行与 note 行 (仅扩输出, 不扩状态机)。
# intent 降级 warning: #[should_panic] 测试的 panic 是预期通过机制, 行级正则无法区分
# (RE2 无 lookahead / 状态机无后视取消), failure intent 在 success 作业命中即 FP
# (公开语料 15 份 success 样本误报 2 份)。job 级失败证据由 rust-libtest-failed 与
# github-actions-error-annotation 兜底, panic 精确定位以 warning 块保留。
id: rust-test-panic
title: Rust 运行时 panic (thread panicked at)
tool: rust
category: test
confidence: high
intent: warning
context: {before: 0, after: 2}
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?thread ''[^'']+''( \([0-9]+\))? panicked at '
kind: signal
