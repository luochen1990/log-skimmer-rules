# lint — 规则 PR 质量门禁 (社区规则集的守门人)
#
# 校验链: 引擎 (发布面 log-skimmer master) × 语料 (corpus 仓) × 本仓规则
#   0. 结构断言 (纯 shell, 不依赖引擎构建, 前置快速失败): 目录名一致性 (tool 字段 ==
#      所在目录名, folksonomy 存在即定义的机器强制) + README 工具清单守护 (宣称集合
#      == 目录实况; 清点自动化, 杜绝人工数数漂移)
#   1. 加载合法性: 引擎加载全部规则 (单条违例整集拒载, exit 2)
#   2. L0 全量断言 (PR 侧): FN=0 / FP率≤2% / 零块=0 / 边界违例=0
#   3. 压缩率双测: base rules (master) vs PR rules — 同引擎同语料, 纯规则变量归因,
#      退化 >2% 判红 (与引擎仓 gate 同一判定语义, 编排对称: 那边变引擎这边变规则)
# 降级: 发布面仓为空 (首次 publish 前) 时显式 skip 并说明 — 不假绿 (日志可见)。
name: lint
on:
  pull_request:
  push: {branches: [master]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: lint-${{ github.ref }} # block 形式: flow mapping 内 ${{}} 的花括号是 YAML 特殊字符, 秒挂根源
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # 本仓规则 (PR merge ref; 显式 path — 规则目录必须精确,
        #  不可用 $PWD 根: 同 workspace 的 engine-repo/corpus 子 clone 会被 --rules 递归扫入)
        with: {path: rules-pr}
      - uses: actions/checkout@v4
        with: {repository: luochen1990/log-skimmer, path: engine-repo}
      - name: 发布面可用性探测 (首次 publish 前显式降级)
        id: engine
        run: |
          if [ -f engine-repo/engine/Cargo.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::发布面仓 (luochen1990/log-skimmer) 尚未同步引擎 — 校验跳过, 首次 publish 后自动生效"
          fi
      - name: "结构断言: 目录名一致性 (tool 字段 == 所在目录名)"
        if: steps.engine.outputs.ready == 'true'
        # folksonomy "存在即定义" 的机器强制: 引擎加载校验只覆盖 id 以 tool 为前缀,
        # 目录名与 tool 的对应链路由本断言补全 (含 <tool-id>/<rule-id>.yaml 单层布局
        # 强制)。取值不用 yq — runner 未预装, 顶层标量 sed 提取在本格式族内无歧义
        # (schema 由引擎加载校验兜底, 模板在 .github/ 隐藏路径不入列)。
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            rel=${f#rules-pr/}
            case $rel in
              */*/*) echo "::error file=$f::布局违例: 规则须为 <tool-id>/<rule-id>.yaml 单层布局"; fail=1 ;;
              */*)
                dir=${rel%%/*}
                tool=$(sed -n 's/^tool:[[:space:]]*//p' "$f" | head -1)
                tool=${tool%%#*}
                tool=$(printf '%s' "$tool" | sed -e "s/^[[:space:]]*//" -e "s/[[:space:]]*$//" -e "s/^['\"]//" -e "s/['\"]$//")
                if [ "$tool" != "$dir" ]; then
                  echo "::error file=$f::tool 字段 '$tool' != 所在目录 '$dir'"
                  fail=1
                fi
                ;;
              *) echo "::error file=$f::布局违例: 规则须位于 <tool-id>/ 目录下"; fail=1 ;;
            esac
          done < <(find rules-pr -name '*.yaml' -not -name '_template.yaml' -not -path '*/.github/*')
          [ "$fail" -eq 0 ] || { echo "目录名一致性/布局断言存在违例 (见上)"; exit 1; }
          echo "目录名一致性: 通过 (tool 字段全部 == 所在目录名)"
      - name: "结构断言: README 工具清单守护 (宣称集合 == 目录实况)"
        if: steps.engine.outputs.ready == 'true'
        # README "当前覆盖 N 个工具: ..." 行与 rules-pr/ 目录列表对账: 集合相等
        # (顺序无关) + N 与基数一致 — 规则数不设断言 (每 PR 自然变化, 由 L0 计数
        # 步的下限护栏兜底), 工具清单是唯一人工维护且需守护的数字。
        run: |
          set -euo pipefail
          readme=rules-pr/README.md
          line=$(grep -m1 '当前覆盖 [0-9]* 个工具:' "$readme" || true)
          if [ -z "$line" ]; then
            echo "::error file=$readme::缺少 '当前覆盖 N 个工具: ...' 清单行 — 工具清单由本断言守护, 须与规则目录实况一致"
            exit 1
          fi
          n=$(printf '%s' "$line" | sed -n 's/.*当前覆盖 \([0-9]*\) 个工具:.*/\1/p')
          claimed=$(printf '%s' "$line" | sed -e 's/.*个工具:[[:space:]]*//' -e 's/。.*//' | tr -d ' ' | tr ',' '\n' | sed '/^$/d' | sort)
          actual=$(ls -d rules-pr/*/ | sed -e 's|^rules-pr/||' -e 's|/$||' | sort)
          ok=1
          if [ "$claimed" != "$actual" ]; then
            echo "::error file=$readme::README 工具清单 (<) 与规则目录实况 (>) 不一致:"
            diff <(printf '%s\n' "$claimed") <(printf '%s\n' "$actual") || true
            ok=0
          fi
          cnt=$(printf '%s\n' "$actual" | grep -c .)
          if [ "$n" != "$cnt" ]; then
            echo "::error file=$readme::README 宣称工具数 N=$n != 目录实况 $cnt"
            ok=0
          fi
          [ "$ok" -eq 1 ] || exit 1
          echo "README 工具清单: 与目录实况一致 ($n 个工具)"
      - uses: actions/checkout@v4
        if: steps.engine.outputs.ready == 'true'
        with: {repository: luochen1990/log-skimmer-corpus, path: corpus, fetch-depth: 1}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.engine.outputs.ready == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.engine.outputs.ready == 'true'
        with: {workspaces: "engine-repo"}
      - name: build engine
        if: steps.engine.outputs.ready == 'true'
        run: cargo build --release -p log-skimmer
        working-directory: engine-repo
      - name: base rules (master of this repo)
        if: steps.engine.outputs.ready == 'true'
        # 路径基准不变量: 相对路径一律以 step 默认 cwd ($GITHUB_WORKSPACE) 锚定。
        # worktree 经 -C 在 rules-pr 内建 ../rules-base → 落 $GITHUB_WORKSPACE/rules-base,
        # 与 L0 步 --rules rules-base 同基准 (曾因 cd 后 ../ 分叉, base 指向不存在目录
        # 被引擎静默当空规则集 → 恒 100% 压缩伪 regression; 引擎已加硬拒绝防线)。
        run: git -C rules-pr fetch --depth 1 origin master && git -C rules-pr worktree add --detach ../rules-base origin/master
      - name: L0 双测 (PR rules vs base rules × 同引擎同语料; 引擎 l0 子命令)
        if: steps.engine.outputs.ready == 'true'
        run: |
          set -euo pipefail
          B=engine-repo/target/release/log-skimmer
          # 计数排除: -not -name '_template.yaml' (模板, 兜底) + -not -path '*/.github/*'
          # (模板已迁 .github/ 隐藏路径, 引擎装载跳过 — issue #8; 一并防 .github/ 下
          #  未来出现其他 yaml (如 workflow 配置片段) 误计入规则数)
          n=$(find rules-pr -name '*.yaml' -not -name '_template.yaml' -not -path '*/.github/*' | wc -l)
          [ "$n" -ge 25 ] || { echo "规则数异常 ($n <25), 疑拉取失败"; exit 1; }
          "$B" l0 --corpus corpus --rules rules-pr --emit-summary > /tmp/s-pr.json
          "$B" l0 --corpus corpus --rules rules-base --emit-summary > /tmp/s-base.json
          "$B" l0 --corpus corpus --rules rules-pr --base /tmp/s-base.json
