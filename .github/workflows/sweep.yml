# sweep — master 常驻防腐扫描 (weekly): 时点间漂移哨兵, 与 lint.yml 分工互补
#
# 分工 (PR 时点回归 vs 时点间漂移防腐):
#   lint  = PR 时点回归: merge 前校验 — 规则加载 + 全语料断言 + master-vs-PR
#           压缩率双测 (同引擎同语料, 纯规则变量归因), 回答「这个 PR 是否让现状变差」;
#   sweep = master 常驻防腐: 每周一次 master 规则集 × 最新语料全量报告, 并与上次
#           成功 run 对比, 回答「两次 PR 的间隙里, 世界 (语料周滚动/上游日志形态
#           演化/引擎演进) 是否让 master 规则集悄悄退化」— PR 时点门禁天然盲区。
#
# 对比语义 (不自写对比逻辑): 上次成功 run 的 l0 summary artifact 作为 --base 传给
#   引擎, 判定全走引擎内置口径 (FN=0 / FP率≤2% / 零块=0 / 边界违例=0 断言族 +
#   compression_compare 逐仓压缩率相对退化 >2% 判红)。红 = 上周→本周的退化信号,
#   归因面是 规则集/引擎/语料 三者时点差的聚合 (语料每周滚动, 同 repo 内容亦变),
#   需人工分诊 — 详见 job summary 与 l0-summary artifact。
#
# 首跑合法首态: 本 workflow 首次运行 (或上次 artifact 超出保留期) 取不到基线 →
#   notice 跳过对比, 仍出全量报告 + 断言族判定 (引擎单测模式) — 不因「无基线」红。
#   基线查询失败 (sweep.yml 未上 master 时 gh 报 404 / API 瞬态) 同理降级为
#   warning + 单测模式; 基线在场而下载失败才红。
#   基线恒取「最近一次成功 run」(红 run 的 artifact 仅作诊断, 不作基线 — 防
#   红→红对比把退化漂移成新常态)。
#
# FN 事件数据面 (fn-responder v2): fn 违例 detail 非空时另产 fn-evidence.json
#   (FN 样本锚行证据摘要, KB 级 — verdict 样本清单 × 语料关键词窗口, 语料本体
#   永不离 runner), 独立 fn-evidence artifact + reports 分支双渠道发布, 供内网
#   agent 免语料研判 (消费契约见 README §6)。
# FN 唤醒门控 (fn-responder v2 唤醒面): fn-evidence 在场时差集判定 (本拍样本 −
#   上拍 prev 快照 − agent/fn-* PR 的 dedup-sample 在途声明), 仅「未被在途响应
#   覆盖的新 FN 样本」非空时发 repository_dispatch (fn-responder-wake) 唤醒
#   agent — 稳态 (同一 FN 在规则合入前每拍重复红) 零发送 = 下游零 token 消耗;
#   sweep 红门禁本身照红 (诚实不变)。差集/冷却/保守边界语义见
#   .github/scripts/fn-dispatch-gate.sh 头注。
# DG 唤醒门控 (dg-responder 唤醒面): 对偶 FN 门控 — summary.json 的
#   diagnostic_gaps (引擎侧诊断缺口清单) 与上次成功 run 的 l0-summary artifact
#   基线差集, 减 open PR 的 dg-samples: 在途声明; 仅新 gap 非空时发
#   repository_dispatch (dg-responder-wake) 唤醒 dg-responder。冷启动 (无基线)
#   基线采纳零派发 (显式 notice); 每拍 ≤20。差集/批量/载荷预算语义 =
#   .github/scripts/dg-dispatch-gate.sh 头注; 全景契约 SSOT = 引擎仓
#   docs/diagnostic-loop.md。
#
# 规则 bundle 产物: 每轮另产 rules-bundle.json (全规则原文单文件, userscript
#   消费源) 随 report 同步发布到 reports 分支 — 生成/口径/格式 SSOT =
#   .github/scripts/make-rules-bundle.sh 头注释; lint 在 PR 时点同步演练生成
#   (口径断言前置到 merge 前)。
#
# 时段: 语料仓 refresh = 4 拍/日 (00/06/12/18 UTC, 单轮 45-115min),
#   sweep 错峰 +3.5h 跟拍 (03:30/09:30/15:30/21:30 UTC) — 恒扫最新语料快照。
name: sweep
on:
  # 语料 6h 刷新 (00/06/12/18 UTC) → sweep 错峰 +3.5h 跟拍 (单轮 refresh 45-115min,
  #   余量充分; 重叠则 concurrency 排队, 后到的扫到更新的语料)
  schedule: [{cron: "30 3,9,15,21 * * *"}]
  workflow_dispatch:
# contents: write = 发布步推送 reports 孤儿分支 (README 活指标徽章数据 SSOT,
#   红绿照常发布 — fail 状态公开可见, 报告恰是红的诊断材料)
permissions:
  contents: write # 三仓 checkout + reports 分支发布
  actions: read # gh run list / gh run download — 取上次成功 run 的 summary artifact
concurrency:
  group: sweep
  cancel-in-progress: false # 哨兵不抢跑: 重叠则排队, 后到的扫到更新的语料
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # 扫描对象: 本仓 master 规则集 (显式 path — 引擎 --rules
        # 递归装载, 同 workspace 的 engine/corpus 子 clone 不得被扫入, 同 lint.yml 注释)
        with: {path: rules}
      - uses: actions/checkout@v4 # 发布面引擎 master — sweep 时点的最新引擎 (漂移面之一)
        with: {repository: luochen1990/log-skimmer, path: engine-repo}
      - uses: actions/checkout@v4 # 语料仓: orphan 单提交强推历史 — fetch-depth 1 每次
        # fresh clone (无本地缓存累积, 无 pull 分叉问题, 天然对齐强推语义)
        with: {repository: luochen1990/log-skimmer-corpus, path: corpus, fetch-depth: 1}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # ~/.cargo registry + target 跨周缓存, 构建分钟级
        with: {workspaces: "engine-repo"}
      - name: build engine
        run: cargo build --release -p log-skimmer
        working-directory: engine-repo
      - name: 取上次成功 run 的 summary artifact (退化对比基线)
        id: prev
        env:
          GH_TOKEN: "${{ github.token }}" # flow scalar 内 ${{}} 须引号 (YAML 花括号)
          # workspace 根不是 git 仓 (三 checkout 皆带 path:), gh 无法从 git 推断 repo —
          # 缺此锚定则查询恒败 (not a git repository) → 每拍 have=false → l0 压缩对比
          # 哨兵失效 ∧ dg/fn 增量派发退化为基线采纳 (响应器永不唤醒)。2026-10-29 实证修复。
          GH_REPO: luochen1990/log-skimmer-rules
        run: |
          set -euo pipefail
          # 查询失败容忍 (warning + 单测模式, 断言族照常): sweep.yml 未上 master 时
          # gh 对 --workflow 按名解析报 HTTP 404 (PR 分支 dispatch 实测), 瞬态 API
          # 失败同类 — 基线缺失不该让哨兵误报红; 基线在场而下载失败才红 (下一行起)。
          if ! runs=$(gh run list --workflow sweep.yml --branch master --status success --limit 1 --json databaseId 2>&1); then
            echo "::warning::查询上次成功 run 失败: $runs — 跳过对比 (断言族照常)"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(printf '%s' "$runs" | jq -rn '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            # 仪表化 (2026-10-30): by-workflow 查询恒空 (GITHUB_TOKEN 疑似), 转储双查询原始返回
            raw2=$(gh run list --branch master --status success --limit 3 --json databaseId,workflowName,createdAt 2>&1 || true)
            echo "::warning::by-workflow 空 — raw: $runs | unfiltered: $raw2"
            echo "::notice::无上次成功 run 的 l0-summary artifact (首跑/保留期外) — 跳过对比 (合法首态), 断言族判定与全量报告照常"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$run_id" --name l0-summary --dir prev
          mv prev/summary.json prev-summary.json
          echo "have=true" >> "$GITHUB_OUTPUT"
          echo "对比基线: $GITHUB_SERVER_URL/${{ github.repository }}/actions/runs/$run_id"
      - name: L0 全量报告 (--emit-summary; artifact 素材, 采集层失败则本步硬红)
        id: report
        run: |
          set -euo pipefail
          engine-repo/target/release/log-skimmer l0 \
            --corpus corpus --rules rules --emit-summary > summary.json
          echo "样本 $(jq -r .structural.samples_total summary.json) 对 (豁免 $(jq -r .structural.samples_exempt summary.json)) — summary.json 已生成"
      - name: L0 判定 (断言族 + base 退化对比; rc 记录不中断 — 报告与 artifact 恒产出)
        id: gate
        run: |
          set -uo pipefail
          base=()
          if [ "${{ steps.prev.outputs.have }}" = "true" ]; then base=(--base prev-summary.json); fi
          set +e
          engine-repo/target/release/log-skimmer l0 \
            --corpus corpus --rules rules "${base[@]}" > verdict.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0 # 红/绿统一由末步落地; 本步中断会吞掉报告与 artifact (红 run 更需要它们)
      - name: FN 证据提取 (fn detail 非空 → fn-evidence.json; 辅助产物, 内部失败降级 warning 不劫持哨兵主链)
        id: fnev
        if: always() && steps.report.outcome == 'success' # 与 artifact/publish 同前置: verdict 在场才有证据可言
        run: |
          set -uo pipefail
          # 脚本契约: 0 = 完成 (含无 FN 零产物的绿跳过) / 1 = 内部错误。证据是辅助
          # 产物 — 红 run 的主链 (verdict/artifact/publish) 不得被它劫持 → warning 降级。
          if ! bash rules/.github/scripts/fn-evidence.sh corpus verdict.json fn-evidence.json; then
            echo "::warning::fn-evidence 提取内部错误 — 跳过证据产物 (哨兵判定与报告不受影响)"
            rm -f fn-evidence.json
          fi
          if [ -s fn-evidence.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: 生成 rules-bundle.json (全规则原文单文件 — userscript 消费源; 口径 = 引擎装载数)
        id: bundle
        # 只依赖 report 步的 summary.json — 零额外引擎开销 (口径 SSOT = 脚本头注释);
        # 生成失败 = 红 run 且发布步跳过 (缺产发布的理由见发布步注释)
        if: always() && steps.report.outcome == 'success'
        run: |
          set -euo pipefail
          bash rules/.github/scripts/make-rules-bundle.sh rules summary.json rules-bundle.json
      - name: 渲染 job summary (gated/exempt 双组 + 逐仓分解 + 规则×仓矩阵, 大表折叠)
        if: always() && steps.report.outcome == 'success'
        run: |
          set -euo pipefail
          [ -s verdict.json ] || echo '{"verdict":"unavailable"}' > verdict.json # gate 步意外崩溃兜底
          {
            echo "# sweep — L0 全量报告"
            echo
            echo "- 引擎 @ \`$(git -C engine-repo rev-parse --short HEAD)\` · 规则 @ \`$(git -C rules rev-parse --short HEAD)\` · 语料 @ \`$(git -C corpus rev-parse --short HEAD)\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          jq -rn -f rules/.github/scripts/summary-md.jq --slurpfile s summary.json --slurpfile v verdict.json >> "$GITHUB_STEP_SUMMARY"
      - name: 上传 l0-summary artifact (完整 JSON; 下次 sweep 的 --base 基线)
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: l0-summary
          path: |
            summary.json
            verdict.json
      - name: 上传 fn-evidence artifact (FN 样本锚行证据摘要 — v2 agent 迭代环机读源, README §6)
        # 独立 artifact 而非并入 l0-summary: 后者是下次 sweep 基线下载的稳定文件集
        # 契约, 且绿 run 无此文件时并入会逐 run 产生 no-files warning — 条件独立
        # 上传零噪音, 「FN 事件 → 证据在场」在 UI 上因果显式 (步 skipped vs ran)。
        if: always() && steps.report.outcome == 'success' && steps.fnev.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fn-evidence
          path: fn-evidence.json
      - name: FN 唤醒门控 (新 FN 样本差集 → fn-responder-wake dispatch; 稳态零发送)
        # 机械门控 (零 LLM): 仅「未被在途响应覆盖的新 FN 样本」非空时发
        #   repository_dispatch 唤醒下游 agent — 稳态 (同一 FN 在规则合入前每拍
        #   重复红) 零发送 = 下游零 token; sweep 红门禁照红 (诚实不变)。
        #   差集/冷却/保守边界见 .github/scripts/fn-dispatch-gate.sh 头注。
        # **顺序不变量: 必须先于发布步** — publish 孤儿强推覆盖 reports 分支,
        #   prev 快照 (raw URL) 取的是覆盖前的上一拍内容。
        # 门控步红不阻断发布与 artifact (后续步均 always 前置); run 本因 FN>0
        #   已红, 步红仅 = dispatch 发送失败 (漏唤醒不可静默), 不劫持哨兵语义。
        id: fnwake
        if: always() && steps.report.outcome == 'success' && steps.fnev.outputs.present == 'true' # 与 fn-evidence 发布同前置: 无 FN 即无差集可判 (skip)
        env:
          REPO_SLUG: luochen1990/log-skimmer-rules
          GITHUB_TOKEN: "${{ github.token }}" # flow scalar 内 ${{}} 须引号 (YAML 花括号); 同仓 dispatch 已被既有 contents:write 覆盖, permissions 无需变更
          RUN_ID: "${{ github.run_id }}"
        run: |
          set -euo pipefail
          bash rules/.github/scripts/fn-dispatch-gate.sh fn-evidence.json
      - name: DG 唤醒门控 (新 diagnostic gap 差集 → dg-responder-wake dispatch; 稳态零发送)
        # 机械门控 (零 LLM), 对偶 FN 门控步: diagnostic gap 非 CI 红事件 (覆盖债
        #   增量面), 仅「未被基线/在途声明覆盖的新 gap 样本」非空时发 dispatch
        #   唤醒 dg-responder。冷启动 = 基线采纳零派发 (notice); 每拍 ≤20;
        #   载荷预算与差集语义见 .github/scripts/dg-dispatch-gate.sh 头注。
        # 门控步红不阻断发布与 artifact (后续步均 always 前置); 步红仅 = 载荷
        #   组装失败或 dispatch 发送失败 (漏唤醒不可静默), 不劫持哨兵语义。
        # 基线 = prev 步的 prev-summary.json (上次成功 run 的 l0-summary
        #   artifact); 文件缺席 (首跑/保留期外) 由脚本内判冷启动, 与 L0 判定步
        #   的 have 分支同源, 本步不重复判。
        id: dgwake
        if: always() && steps.report.outcome == 'success' # summary.json 在场即可判 (gaps 不依赖 fn-evidence 类前置产物)
        env:
          REPO_SLUG: luochen1990/log-skimmer-rules
          GITHUB_TOKEN: "${{ github.token }}" # flow scalar 内 ${{}} 须引号 (YAML 花括号); 同仓 dispatch 已被既有 contents:write 覆盖, permissions 无需变更
          RUN_ID: "${{ github.run_id }}"
        run: |
          set -euo pipefail
          bash rules/.github/scripts/dg-dispatch-gate.sh summary.json prev-summary.json
      - name: 发布 reports 分支 (README 活指标徽章数据 + latest.md + rules-bundle.json; 红绿照常发布)
        # bundle 步耦合: rules-bundle.json 是常驻产物 (history.jsonl 族) — 生成失败
        # 时跳过发布: orphan 单提交重写会清掉上一版 bundle, 缺产发布 = 消费方 404;
        # 报告的让位由红 run 自身可见性兜底 (上一版 reports 快照保持完整服务)
        if: always() && steps.report.outcome == 'success' && steps.bundle.outcome == 'success'
        env:
          REPO_SLUG: luochen1990/log-skimmer-rules
          GITHUB_TOKEN: "${{ github.token }}" # flow scalar 内 ${{}} 须引号 (YAML 花括号)
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          bash rules/.github/scripts/publish-report.sh summary.json verdict.json \
            "$(git -C engine-repo rev-parse HEAD)" \
            "$(git -C rules rev-parse HEAD)" \
            "$(git -C corpus rev-parse HEAD)" \
            fn-evidence.json rules-bundle.json # 第 6 参可选 (仅 FN 红 run 在场, 脚本内 -f 容忍缺失); 第 7 参必填 (常驻产物)
      - name: gate 结果落地 (断言违例/退化 → 红)
        if: always()
        run: |
          rc=${{ steps.gate.outputs.rc || '1' }} # gate 未跑成 (report 已硬红) 视为 1, 不吞红
          if [ "$rc" -ne 0 ]; then
            echo "::error::l0 判定未通过 (rc=$rc, 语义: 1=断言违例或退化 / 2=语料或规则非法) — 违例清单与逐仓分解见 job summary, 原始数据见 l0-summary artifact"
          fi
          exit "$rc"
