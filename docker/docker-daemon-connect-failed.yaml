# 锚: docker CLI 在 daemon 层不可达时的判词 `failed to connect to the docker API at
# <endpoint>;` — npipe (Windows) 与 unix socket 同前缀, 任何仓的 CI 里 docker 命令在
# daemon 未运行时必打此行; 成功侧恒无 (可达才可能成功), 全语料 2F/0S。与 docker-build-failed
# (buildkit 判词) / docker-registry-pull-failed (registry 交互) 互斥: 本形态到不了后两者。
