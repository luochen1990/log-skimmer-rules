# cargo-deny check 的 lint 违例错误块: 锚 `error[<lint-id>]: ` 行 (unmaintained/advisory/ban/
# license 等 lint id 字面量, 样本为 RUSTSEC unmaintained 通告), 后随 ┌──/│/└ 树状证据块 —
# RUSTSEC 编号/Advisory 链接/Solution/依赖树全在块内, 缩进 ≥2 空格贪心消费, 空行闭块。
# 锚自带 ANSI 色码容忍 (cargo-deny 把色码嵌在 error 行内, A0 约定引擎不预处理; 无色码形态由
# `(?:\x1b\[[0-9;]*m)*` 零段匹配覆盖)。错误行只在 check 失败时出现 — 成功 job 全 ok, 无 FP 面。
