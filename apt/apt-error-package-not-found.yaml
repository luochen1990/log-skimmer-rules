# 锚: apt ≥3.0 (Ubuntu 26.04 runner) 全词前缀形态 `Error: Package '<n>' has no installation
# candidate` / `Error: Unable to locate package <n>` — 语义与 E: 前缀两兄弟规则 (apt-package-
# unavailable / apt-unable-to-locate-package) 同族, apt 3.x 把 E:/W: 换成全词前缀后旧锚不命中;
# before 2 带出 "Package X is not available..." 提示行。成功侧装包正常不出现 — FP 免疫。
