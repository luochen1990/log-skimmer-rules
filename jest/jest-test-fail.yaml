# jest 失败证据两形态:
# ① 行首无色 `FAIL <JS 路径>` — jest 非 TTY 输出 (prettier/next.js/phoenix 实测); 要求行内含 JS 族
#    扩展名路径 (jest FAIL 恒指名测试文件), 排除 curl 自有测试框架的 `FAIL 1696: '<用例名>'` 形态
#    (curl 失败样本实测误吸, 其证据归 curl 工具域); 行首锚定不吞缩进形态, 与 vitest 红底 FAIL 不相交;
# ② `  ● <suite> › <test>` 失败详情头 (U+25CF) — 含 `● Test suite failed to run` 套件级失败
#    (next.js 实测); ● 前恒有 2 空格缩进 (jest 版式; 2 空格是判定依据 — dotnet agent 活动日志的
#    列 0 `● Read file` 形态被排除, l0 双测门禁红驱动), 容忍 ANSI 色码;
#    ● 行要求失败签名 (› 分隔符或 `Test suite failed to run`) — 成功 run 中的 `  ● Console` 输出组
#    同为 2 空格 + ● 形态 (mitmproxy 成功样本实测 FP), 以签名区分;
#    vitest 用 ×/❯/✓ 不用 ●, 不相交。
# 注: jest 带 ANSI 的 ` FAIL ` (stylelint 实测 `[0m[7m[1m[31m FAIL `) 不在本锚内 — 其下方的 ● 行已捕获同
#     一失败的证据, 放弃对色码 FAIL 字面量的穷举 (避免与 vitest FAIL 字面量的边界纠缠)。
# context.after=1 仅带出 ● 行下一行 (● 行自身即"哪个用例挂了"的证据; 期望-实际 diff 细节体量大
# — 小日志仓 (phoenix npm-test 342 行 ×6● 实测) 逐●展开触发压缩率双测门禁, 由 read_around 按需展开);
# FAIL 行与紧随 ● 行相邻由 A5 合并。
