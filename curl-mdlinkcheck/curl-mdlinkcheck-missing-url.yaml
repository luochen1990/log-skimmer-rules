# 锚: curl 仓 scripts/mdlinkcheck (仓自有 Perl 链接检查器) 的逐链接判词
# `<file>:<line> ERROR links to missing URL <url>` — 语义 = 哪个文件哪行链向失效 URL;
# loop 消费相邻同形判词, context.before 带出 `Checked N URLs` / `N URLs had problems:`
