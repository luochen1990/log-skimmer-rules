# samples: github.com/curl/curl/2026-11-04/41873996439-126728362615-midnightbsd-4.0.4,-CM-clang-gn-failure.log.gz
# 锚: MidnightBSD mport 包管理器依赖获取失败判词
# `Error at <path>/fetch.c:(NNN): Fetch error: <url>: <原因>` — mport 原生签名
# (编译期 __FILE__:__LINE__ 内嵌, 行号随 mport 版本漂移故用 [0-9]+ 容忍; 路径用 \S* 容忍)。
# 本样本因果链: pkgconf/jsoncpp/ninja 包获取 Operation timed out (L305/313/314/342) →
# 依赖缺失 → 后续 configure 命令 exit 127 command not found (L419)。fetch 判词是日志中
# 最早的真因文本 (deps 根因), 终态 exit 127 只是下游后果 — 锚取根因, 不锚 exit 行
# (exit 127 属 github-actions-error-annotation 安全网射程, 且无数值特异性)。
# 成功侧 mport 获取静默 (获取失败才打印判词) — 全语料扫描: 1 failure / 0 success 含此签名。
# category=deps: 依赖下载失败 (spec §1 category 表「依赖获取失败归 deps」)。
