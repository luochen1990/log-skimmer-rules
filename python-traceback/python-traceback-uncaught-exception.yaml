# Python 未捕获异常 traceback 的尾行 (异常类名 + 消息) — 解释器崩溃的收束签名:
#   FileNotFoundError: [Errno 2] No such file or directory: 'artifacts/Event File/event.json'
#   AssertionError: 2 != 1 : Found 2 instances of '...' (expected 1) ...
# 锚选择依据 (FP 免疫优先于召回, 三重收窄, 全语料成功侧实测 0 命中):
#   1. 裸类名 (无点分包前缀) — Java 全限定名 (jakarta.jms.JMSException) / Haskell 模块名
#      (Hadolint.Formatter.ParseError) 免疫 (spring-boot/hadolint 成功样本实测);
#   2. 必须带非空消息 (\`: .+\`) — 空消息行 (\`java.lang.Exception: \`) 与裸类名行免疫;
#   3. 类名以 Error|Exception 结尾 — 成功侧被捕获打印的预期异常 (pydantic 的
#      StopIteration / coverage_comment.github.NoArtifact) 免疫。
# 点分全限定形态 (django.core...CommandError / subprocess.CalledProcessError) 刻意不覆盖 —
# 与 Java 预期内异常日志 (spring-boot 成功样本) 同构无法判别, 该形态样本均已有其他规则覆盖。
# 单行锚 + context.before 7 带出 traceback 主体 (File/源码行) — 状态机不扩展 (防贪心吞段),
# 证据完整性由呈现层 context 兑现。category 跨因 (assert/infra/deps) → unknown (宁缺勿错)。
