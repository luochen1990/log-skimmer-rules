# turbo (Turborepo) 任务失败三形态 (plain 与 ANSI 双形态实测):
# ① `ERROR  run failed: command  exited (1)` — run 级终结失败 (无任务名, 双空格);
# ② `<pkg>#<task>:  ERROR  command (<cwd>) <cmd> exited (1)` — 任务级失败横幅 (command 与 exited
#    间可含路径/命令文本, 用 `.*` 容忍);
# ③ `Failed:    <pkg>#<task>` — 汇总区的失败任务清单 (冒号后空格对齐)。
# ` ERROR ` 横幅 + `command ... exited (N)` 组合双端限定, 不与 webpack `ERROR in ...` 形态相交;
# `Failed:` 后 2+ 空格对齐 (turbo 汇总版式), 排除 elixir mix test 的 `Failed: 1 test` 单空格形态
# (elixir 失败样本实测误吸)。
# context.before=3 带回 ` Tasks:/Cached:/Time:` 汇总三行 (任务定量上下文)。
