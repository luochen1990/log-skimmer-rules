# 锚: PHPStan 逐文件错误表头 `  Line   src/.../File.php` — `Line` 列头 + php 路径
# 是表格结构签名; 扩展: 行号行 `  222  msg` + 缩进续行 (贪心), 表尾分隔线
# ` ------ `(单空格起) 与空行闭块。
# 定位粒度补充: 收尾汇总见 phpstan-found-errors; 注解在场时文件/行细节在
