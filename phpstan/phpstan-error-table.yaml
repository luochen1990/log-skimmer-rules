# 的逐文件定位。
id: phpstan-error-table
title: 'PHPStan 逐文件错误表 (  Line   src/.../File.php)'
tool: phpstan
category: typecheck
confidence: medium
patterns:
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)* +Line +\S+\.php'
  - regex: '^ +[0-9]+ +\S'
  - regex: '^ {2,}\S'
    loop: true
