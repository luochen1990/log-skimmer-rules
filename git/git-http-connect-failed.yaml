# git HTTP 传输在连接层失败 (curl 连不上 / DNS 解析不到): 锚 `fatal: unable to access '<url>': Failed to connect to <host> port <N>`
# 或 `Could not resolve host` — git 自身标准 fatal 签名, 任何仓的 https remote clone/fetch/push 均可出现
# (本拍: pandas musl 容器内 `git clone --recursive` 对 github.com 443 连接超时 134s; before 2 带出触发的
# git 命令行与 `Cloning into '<dir>'...`)。语料普查 (2026-11-28): `unable to access` 尾部仅三族 —
# 40[34] 拒答 (git-http-access-denied 已收) / Could not resolve host ×6 (delta / nlohmann-json / cabal 失败样本,
# 已由他规则覆盖) / Failed to connect ×1 (本样本); 三族全部落在 failure 侧, success 侧 0 命中。
# 与 git-http-access-denied (服务端确定性拒答) 正交: 本规则是传输层网络失败 (环境根因, 重试可恢复)。
