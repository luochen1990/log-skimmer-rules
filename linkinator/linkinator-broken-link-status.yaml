# 锚: linkinator 逐链状态行中的失败态 `[4xx/5xx] http(s)://URL` — 成功侧恒为 [200]/[226] 等 2xx,
# 4xx/5xx 仅在断链 (失败) 时出现; 顶层与文件小节缩进两形态都以行首 (可选 ts 前缀) 起锚。
id: linkinator-broken-link-status
title: 'linkinator 断链明细 ([4xx/5xx] URL)'
tool: linkinator
category: lint
intent: failure
confidence: high
context: {before: 1, after: 0}
patterns:
