# 锚: linkinator 收尾摘要 `ERROR: Detected N broken links. Scanned M links in X seconds.`
# — linkinator 检出断链时以 error 级 logger 输出此行并置退出码 1, success 侧无此行
# (FP 免疫; N≥1 双保险收紧)。断链明细行 `[4xx] URL` 位于扫描流中段 (距锚 ~100 行),
# 不入鄚 — 裸状态码行做锚会在通过型日志里误撞正常的 4xx 断言/回显输出。
id: linkinator-broken-links
title: 'linkinator 断链检出 (ERROR: Detected N broken links)'
tool: linkinator
