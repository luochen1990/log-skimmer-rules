# samples: self-provided (trufflehog v3 真机运行产出, 见 PR 附样例 samples/self/trufflehog-fail.log;
#   产出命令: trufflehog git file://<fixture-repo>, fixture 内含假 github-pat, 验证器判 unverified)
#   语料激活说明: 语料清单已播种 trufflesecurity/trufflehog (projects.yaml exempt: onboarding-security)。
# trufflehog 检出未验证密钥: 锚 `Found unverified result 🐷🔑❓` (plain 输出, bold white)。
#   intent=warning 而非 failure — 分寸依据: 检测器模式命中但验证未通过 (假密钥/已轮换/验证器
#   网络不可达), 门禁是否失败取决于 --fail 与 --results 过滤 (trufflehog 官方 dogfood 用
#   --results=verified, 本形态不红); 且 detector 测试类 job 在**通过**时也会大量产出该形态
#   (对 fixture 假密钥的预期检出), 打 failure 会在语料成功侧制造 FP。按 spec intent 语义表:
#   warning = 有问题倾向但非失败, 不计 FP 不参与 FN — 恰合本形态。verified 形态见姊妹规则
#   trufflehog-secret-found (failure)。Verification issue 行 (验证器报错) 是其问题倾向的
#   佐证, 已被扩展吞入块内。
id: trufflehog-unverified-secret
title: trufflehog 检出未验证密钥 (问题倾向)
tool: trufflehog
category: security
intent: warning
confidence: medium
patterns:
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*Found unverified result'
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*(?:[A-Z][A-Za-z0-9_ ]*: .+|\(🔍 Using cached verification\))$'
    loop: true
kind: signal
