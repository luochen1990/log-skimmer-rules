# samples: self-provided (trufflehog v3 真机运行产出的 unverified 形态 + 源码权威字符串
#   pkg/output/plain.go L52 `✅ Found verified result 🐷🔑`; verified 分支需真实存活密钥, 无法
#   合规自造, 以源码字符串为锚 — plain.go Print() 逐分支核对。PR 附样例 samples/self/trufflehog-fail.log)
#   语料激活说明: 语料清单已播种 trufflesecurity/trufflehog (projects.yaml exempt: onboarding-security),
#   下一轮 refresh 入库后由 secrets.yml (Scan for secrets, dogfood --results=verified) 失败样本激活。
# trufflehog 检出已验证密钥: 锚 `✅ Found verified result` (plain 输出, bold green)。verified =
#   验证器确认存活的密钥, 在任何门禁用法 (action --fail, exit 183) 下都是确定性失败证据 —
#   intent=failure。扩展枚举吞后续明细块 (Detector Type/Raw result/Commit/File/... Title-cased
#   `Key: value` 行 + 缓存验证标记行), 空行闭块。--json 输出无 plain 行, 不在本规则射程
# (平台注解兜底)。
id: trufflehog-secret-found
title: trufflehog 检出已验证密钥 (Found verified result)
tool: trufflehog
category: security
confidence: high
patterns:
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*(?:✅ )?Found verified result'
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*(?:[A-Z][A-Za-z0-9_ ]*: .+|\(🔍 Using cached verification\))$'
    loop: true
kind: signal
