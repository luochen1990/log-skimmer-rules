# 锚: 新版 nix (`nix build`, 2.2x+/Lix) 构建失败判词 `error: Cannot build '/nix/store/<hash>-<name>.drv'.` —
# 既有 nix-build-failed 锚的是 `builder for '...drv' failed with exit code N;` / `build of '...' failed` 旧形态,
# 本形态是其近失变体 (加性-only 纪律下独立成规则, 不改既有锚)。扩展贪心吞 7 缩进明细: `Reason: builder failed
# with exit code N.` / `Output paths:` / `Last N log lines:` (`> ` 前缀构建器日志摘录, 常含真因) / `For full logs,
# run: nix log ...`; 遇非缩进行 (##[error] / error: 求值树) 闭块。构建失败恒致 job 失败, 成功样本零命中。
