# samples: NixOS/nix#15785, NixOS/nix#9161, NixOS/nix#1250 (GitHub issue 粘贴, 非语料样本 —
#          I3 前瞻起草: 源码锚 src/libstore/filetransfer.cc `unable to %s '%s': ...` 族,
#          公开语料零出现属预期, 待形态出现由 D1.3 转正)
# 形态: 下载终局失败的行内判词 `error: unable to download '<url>': <reason>` — url 与原因
#        (HTTP error 404 / SSL peer certificate ... / Couldn't resolve host name / curl error ...)
#        携带特异信息。注意与瞬时重试噪音分离: `warning: error: unable to download ...;
#        retrying in N ms` 以 warning: 前缀开头 (语料 LnL7/nix-darwin 有采样), 本规则锚
#        error: 顶格形态, 不匹配重试形态 (重试噪音族暂不立规则, 见 PR 讨论)。下载域此前
#        无规则覆盖 — 本条补 deps 域首个下载终局失败锚。high 依据: `unable to download`
#        + 单引号 url + nix errno 风格尾巴的组合跨工具撞形风险极低。
#        遗留 2.3 时代弯引号形态 (‘url’) 不覆盖, 待语料出现再议。
id: nix-download-failed
title: 'nix 下载失败 (error: unable to download ''...'': ...)'
tool: nix
category: deps
confidence: high
intent: failure
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?\s*(?:… )?(?:\x1b\[[0-9;]*m)?error: unable to download ''[^'']+'': .+$'
kind: signal
attribution:
  contributor: luochen1990
  generated-by: {harness: opencode-agent, model: glm-5.3}
  adapter-version: 0.1.0
