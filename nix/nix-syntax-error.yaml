# samples: NixOS/nix#7202 (`> ` builder 回显形态 + 顶格形态), NixOS/nix#16010,
#          NixOS/nix#10106, NixOS/nix#8777, NixOS/nix#16521 (REPL 形态) (GitHub issue 粘贴,
