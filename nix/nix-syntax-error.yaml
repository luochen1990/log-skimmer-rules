#          转正)
# 形态: nix 语言解析错误的行内判词 `error: syntax error, unexpected <token>[, expecting
#        <token>...]` — token 名携带特异信息。builder 输出内以 `> ` 前缀回显 (出自宿主
#        nix-build-failed 的 "last N log lines" 块, 与 nix-buildenv-collision 的宿主/根因
#        分工同款), 顶格直出两者皆锚。bison 默认措辞与其他 yacc 系工具同源 (confidence
#        取 medium 的原因), 但 `error: ` 前缀 + 语料零撞形下风险可控。
id: nix-syntax-error
title: 'nix 语法错误 (error: syntax error, unexpected ...)'
tool: nix
