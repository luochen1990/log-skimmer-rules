# samples: github.com/denoland/deno/2026-11-27/45977124148-140431584549-build-release-linux-x86_64-failure.log.gz
# 锚: AWS CLI `aws s3 cp/sync` 传输失败单行判词 `upload failed: <local> to s3://<key> An error occurred
# (<Code>) when calling the <Op> operation: <msg>` (本样本: InvalidPart / CompleteMultipartUpload — 对象存储
# 端 multipart 分片丢失)。成功侧同构行是 `upload: <local> to s3://<key>` (无 failed + 无 boto 错误尾), 由
# `failed:` 与 `An error occurred (...) when calling the ... operation:` 双签名免疫 FP; download failed: 是同一
# 代码路径的对称形态一并收口。任何仓的 aws-cli 对象存储上传/下载步骤通用 (endpoint 可为 S3 兼容服务)。
