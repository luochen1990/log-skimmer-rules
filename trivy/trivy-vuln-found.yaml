# 消费方按坐标 read_around 展开, 不整表捕获 (索引+摘要, 防压缩率退化)。注意 trivy 以
# --exit-code 1 门禁运行时该表即失败证据; 扫描报告被重定向到 artifact 的用法 (如 kafka
# scan_jvm) 日志中无表, 不在本规则射程内 (平台注解兜底)。
