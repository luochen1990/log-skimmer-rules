# samples: aquasecurity/trivy/2026-11-01/41318035225-124882143730-Lint-GitHub-Actions
# 锚: zizmor (GitHub Actions 安全审计工具) 审计发现行 "error[<audit-id>]: <message>"
# — 审计 id 为小写-连字符词表 (dangerous-triggers/template-injection/...), 与 rustc "error[E0308]"
# (大写 E + 数字) 及 ty "error[unresolved-import]" (实测嵌在 diff 快照行中、非行首) 不相交;
# 成功侧 zizmor run 只产 INFO 行 (语料 8 个 zizmor-success 样本零 error[ 行)。
# ext: 贪心消费缩进行 (rustc 式 --> 定位/| 源码窗/= note/= help), 空行闭块。
id: zizmor-audit-error
title: 'zizmor 审计发现 (error[audit-id]: ...) + rustc 式诊断扩展'
tool: zizmor
category: security
intent: failure
confidence: high
patterns:
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*error\[[a-z0-9][a-z0-9-]*\](?:\x1b\[[0-9;]*m)*: '
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?[ \t]+\S'
    loop: true
kind: signal
attribution:
  contributor: 'LuoChen <2309868+luochen1990@users.noreply.github.com> (agent-drafted, dg-responder/glm-5.3)'
  generated-by: {harness: dg-responder, model: glm-5.3}
  adapter-version: 0.1.0
