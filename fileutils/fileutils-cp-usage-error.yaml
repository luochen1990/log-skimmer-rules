# 锚: BSD cp 用法错误块 `usage: cp [-R ...] source_file target_file` + 续行
# `       cp [-R ...] ... target_directory` — macOS runner 上 CI 脚本以非法参数调
# cp 时的固定判词 (exit 64 EX_USAGE), 本样本证书裁剪脚本调用 cp 失败, 工具签名
# 非仓守卫文案。任何仓的 macOS runner 脚本均可出现。GNU cp 的 `cp: missing file
# operand` / `Try 'cp --help'` 族词法面不相交; fileutils-cannot-access 锚
# `cp: cannot ...` 存取失败族, 与用法错误族互补。
