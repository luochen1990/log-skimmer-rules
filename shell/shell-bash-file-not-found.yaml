# 锚: bash 找不到路径形目标 'bash: <path>: No such file or directory' — 目标段要求含 '/' (脚本/
#   工件路径形态), 区别于 command-not-found 族的裸命令名; 与 shell-command-not-found 的
#   '.sh: line N:' 扩展锚面不相交 (本形态无 line 段; 该规则头注释记录泛化 ': line N:' 曾有
#   success benign 命中, 故本锚不放松路径约束)。Windows Git-bash 同文案。
