# 锚: cmake -Werror=dev 下 developer 警告升级错误头 `CMake Error (<warning-id>) at <f>:<l> (<cmd>):`
# (实测 non-target-directive, secp256k1 add_compile_definitions/options 违规 ×11) — 与既有
# cmake-configure-error 的 `CMake Error at` 锚字符级不相交 (Error 后多 ` (id)` 段);
# warning-id 泛化 [a-z0-9-]+; 续行 (缩进/-- 状态行/Call Stack) 沿用同款, col-0 行闭块。
# FP: CMake Error 头仅失败路径出现, success 侧零命中。
id: cmake-configure-error-dev-policy
title: 'cmake dev 警告升级错误块 (CMake Error (warning-id) at f:l (cmd):)'
tool: cmake
category: build
intent: failure
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?CMake Error \([a-z0-9-]+\) at \S+:[0-9]+ \([^)]+\): ?$'
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(-- .*|\s+\S.*|Call Stack \(most recent call first\):| *)$'
    loop: true
kind: signal
