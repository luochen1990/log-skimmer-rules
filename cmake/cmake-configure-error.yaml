# 锚: cmake configure 期错误头 `CMake Error at <file>:<line> (<command>):` — 语料全形态皆带
# `at ... (cmd):` 后缀 (message / cmake_minimum_required 等); Windows 路径 (D:/a/...) 与 Unix
# 路径均在。扩展: 缩进续行 / 空行 / `-- ` 状态行 (`-- Configuring incomplete, errors occurred!`
# 会插在消息中间, 故入扩展) / `Call Stack (most recent call first):` 栈头 (col-0) — 任一 col-0
# 非状态行 (如 `+ cd ...` shell 回显) 即闭块, 防吞后续 CMakeConfigureLog 转储。
id: cmake-configure-error
title: 'cmake 配置错误块 (CMake Error at f:l (cmd): + 缩进续文/Call Stack 扩展)'
tool: cmake
category: build
