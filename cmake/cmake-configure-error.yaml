  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?CMake Error at [^:]+:[0-9]+ \([^)]+\): ?$'
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(-- .*|\s+\S.*|Call Stack \(most recent call first\):| *)$'
    loop: true
