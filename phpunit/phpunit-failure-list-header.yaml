# 锚: PHPUnit 失败清单头 "There was 1 failure:" / "There were 4 errors:" — PHPUnit 结构签名,
# 跨仓稳定 (composer/laravel/phpstan/symfony 同形); warning 变体不入锚 (failOnWarning=false 时
# warning-only run 可成功退出, FP 面 — 与 phpunit-failures-banner 排除 WARNINGS! 同理)。
# context.after=6 把首个 "N) Class::test" 条目与消息行带进输出。既有 phpunit-failures-banner
# 在本批样本因横幅行尾随 ANSI 重置码 ("FAILURES!\x1b[0m") 未命中 — 该规则锚的 $ 前不容尾随
# ANSI, 属既有规则修正建议 (见 dg-triage issue), 本规则以清单头为独立锚补盲。
id: phpunit-failure-list-header
title: 'PHPUnit 失败清单头 (There was/were N failure(s)/error(s):)'
tool: phpunit
category: test
intent: failure
confidence: high
context: {before: 0, after: 6}
patterns:
  - regex: '^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?There (?:was|were) [1-9][0-9]* (?:failures?|errors?):'
