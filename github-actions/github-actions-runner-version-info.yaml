# samples: sst__opencode/38850055589-116809069736, niri-wm__niri/*, nix-community__home-manager/* (全部 GHA 样本首行); jgm__pandoc/40230829214-121281986692 (脱敏形态)
# 成功侧安全网 (spec §0 召回优先配套): GHA job 日志首行恒有 runner 版本声明 —
# 与失败侧 annotation 安全网对称, 兑现「任何 CI 日志 skim 非零」的结构承诺,
# 使零块无条件等于「规则集失明」→ fallback。行内匹配 (容忍 BOM/时间戳前缀)。
# 锚定语义: 平台固定字面前缀 — 抗 secret 掩码对版本号的污染 (样本: pandoc 输出正文
# 字符 2 全被掩码成 `***`, 平台附加的时间戳列不参与掩码 — 平台固定字面永不被打码);
# 不约束版本主体形态, 掩码打成什么都不失明。
id: github-actions-runner-version-info
title: GHA runner 版本信息 (成功侧安全网)
